name: confidenceld
description: "ConfidenceLD - messagerie confidentielle avec envoi de messages et médias en vue unique"
publish_to: 'none'
version: 1.2.2+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  socket_io_client: ^2.0.3+1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  path_provider: ^2.1.4
  package_info_plus: ^8.0.2
  open_filex: ^4.4.0
  permission_handler: ">=13.0.0 <14.0.0"
  url_launcher: ^6.3.2
  flutter_contacts: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  permission_handler_android: ^13.0.0

flutter:
  uses-material-design: true